global:
  scrape_interval: 15s
  scrape_timeout: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: calls
    metrics_path: /metrics
    static_configs:
      - targets:
          - laravel.test:80
