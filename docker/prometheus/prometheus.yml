global:
  scrape_interval: 15s
  scrape_timeout: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: calls
    metrics_path: /metrics
    static_configs:
      - targets:
          - laravel.test:80

  - job_name: kafka
    static_configs:
      - targets:
          - kafka-exporter:9308

  - job_name: redis
    static_configs:
      - targets:
          - redis-exporter:9121

  - job_name: containers
    static_configs:
      - targets:
          - cadvisor:8080
