# For more information: https://laravel.com/docs/sail
services:
    laravel.test:
        build:
            context: ./docker/sail/8.4
            dockerfile: Dockerfile
            args:
                WWWUSER: '${WWWUSER:-1000}'
                WWWGROUP: '${WWWGROUP:-1000}'
        image: sail-8.4/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
            kafka:
                condition: service_healthy

    pgsql:
        image: 'postgres:18-alpine'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-password}'
            POSTGRES_DB: '${DB_DATABASE:-calls}'
            POSTGRES_USER: '${DB_USERNAME:-sail}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-password}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test: ['CMD', 'pg_isready', '-q', '-d', '${DB_DATABASE:-calls}', '-U', '${DB_USERNAME:-sail}']
            retries: 5
            timeout: 5s

    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            retries: 5
            timeout: 5s

    kafka:
        image: 'apache/kafka:3.9.0'
        ports:
            - '${FORWARD_KAFKA_PORT:-9094}:9094'
        environment:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
            KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        volumes:
            - 'sail-kafka:/bitnami/kafka'
        networks:
            - sail
        healthcheck:
            test: ['CMD-SHELL', '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1']
            retries: 10
            timeout: 10s

    kafka-ui:
        image: 'provectuslabs/kafka-ui:latest'
        ports:
            - '${FORWARD_KAFKA_UI_PORT:-8081}:8080'
        environment:
            KAFKA_CLUSTERS_0_NAME: local
            KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
        networks:
            - sail
        depends_on:
            kafka:
                condition: service_healthy

    kafka-exporter:
        image: 'danielqsj/kafka-exporter:latest'
        command:
            - '--kafka.server=kafka:9092'
            - '--web.listen-address=:9308'
        networks:
            - sail
        depends_on:
            kafka:
                condition: service_healthy

    redis-exporter:
        image: 'oliver006/redis_exporter:latest'
        environment:
            REDIS_ADDR: 'redis://redis:6379'
        networks:
            - sail
        depends_on:
            redis:
                condition: service_healthy

    cadvisor:
        image: 'gcr.io/cadvisor/cadvisor:latest'
        privileged: true
        devices:
            - '/dev/kmsg:/dev/kmsg'
        volumes:
            - '/:/rootfs:ro'
            - '/var/run:/var/run:ro'
            - '/sys:/sys:ro'
            - '/var/lib/docker:/var/lib/docker:ro'
            - '/dev/disk:/dev/disk:ro'
        networks:
            - sail

    prometheus:
        image: 'prom/prometheus:v3.13.2'
        ports:
            - '${FORWARD_PROMETHEUS_PORT:-9090}:9090'
        volumes:
            - './docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro'
            - './docker/prometheus/rules:/etc/prometheus/rules:ro'
            - 'sail-prometheus:/prometheus'
        command:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--storage.tsdb.retention.time=7d'
        networks:
            - sail
        depends_on:
            laravel.test:
                condition: service_started
            kafka-exporter:
                condition: service_started
            redis-exporter:
                condition: service_started
            cadvisor:
                condition: service_started

    alertmanager:
        image: 'prom/alertmanager:v0.29.0'
        ports:
            - '${FORWARD_ALERTMANAGER_PORT:-9093}:9093'
        volumes:
            - './docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro'
            - 'sail-alertmanager:/alertmanager'
        command:
            - '--config.file=/etc/alertmanager/alertmanager.yml'
            - '--storage.path=/alertmanager'
        networks:
            - sail

    grafana:
        image: 'grafana/grafana:latest'
        ports:
            - '${FORWARD_GRAFANA_PORT:-3000}:3000'
        environment:
            GF_SECURITY_ADMIN_USER: '${GRAFANA_ADMIN_USER:-admin}'
            GF_SECURITY_ADMIN_PASSWORD: '${GRAFANA_ADMIN_PASSWORD:-admin}'
            GF_USERS_DEFAULT_THEME: light
        volumes:
            - 'sail-grafana:/var/lib/grafana'
            - './docker/grafana/provisioning:/etc/grafana/provisioning:ro'
            - './docker/grafana/dashboards:/var/lib/grafana/dashboards:ro'
        networks:
            - sail
        depends_on:
            prometheus:
                condition: service_started
            alertmanager:
                condition: service_started

networks:
    sail:
        driver: bridge

volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
    sail-kafka:
        driver: local
    sail-prometheus:
        driver: local
    sail-alertmanager:
        driver: local
    sail-grafana:
        driver: local
